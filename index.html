<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cooch Behar Healthcare Directory</title>
<meta name="theme-color" content="#2c7a7b">
<meta name="description" content="Community-powered healthcare discovery platform for Cooch Behar">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="noticeBar" class="notice hidden">
<div class="noticeText" id="noticeText"></div>
<button id="closeNotice" class="iconBtn">✕</button>
</div>

<header class="header">
<div>
<h1>Cooch Behar Healthcare</h1>
<p>Community-powered healthcare directory</p>
</div>
<button id="menuBtn" class="iconBtn">☰</button>
</header>

<nav id="drawer" class="drawer">
<a href="#">Privacy Policy</a>
<a href="#">Terms</a>
<a href="#">Transparency</a>
<a href="#">Docs</a>
</nav>

<main class="main">

<section class="searchWrap">
<input id="searchInput" type="search" placeholder="Doctor,specialty,area,phone...">
<select id="areaFilter">
<option value="">All Areas</option>
</select>
</section>

<section id="specWrap" class="specWrap"></section>

<section class="stats">
<div>👥 Total Visitors</div>
<strong id="visitorCount">0</strong>
</section>

<section id="doctorList" class="list"></section>

<div id="emptyState" class="empty hidden">
<p>No doctors found</p>
</div>

</main>

<button id="addFab" class="fab">＋</button>
<button id="feedbackFab" class="fab feedbackFab">💬</button>

<div id="doctorModal" class="modal hidden">
<div class="modalBox">
<div class="modalHead">
<h2>Add Doctor</h2>
<button data-close class="iconBtn">✕</button>
</div>

<form id="doctorForm" class="form">

<input name="name" placeholder="Doctor Name *" required>
<input name="specialty" placeholder="Specialty *" required>
<input name="degree" placeholder="Degree">
<input name="chamber_name" placeholder="Chamber Name *" required>
<input name="chamber_address" placeholder="Chamber Address">
<input name="area" placeholder="Area *" required>
<input name="city" placeholder="City">
<input name="phone" placeholder="Phone *" required>
<input name="whatsapp" placeholder="WhatsApp">
<input name="session_1" placeholder="Session 1">
<input name="session_2" placeholder="Session 2">
<input name="session_3" placeholder="Session 3">
<input name="time_description" placeholder="Timing Notes">
<input name="fees" placeholder="Fees">

<div class="divider">Your Info</div>

<input name="submitter_name" placeholder="Your Name *" required>
<input name="submitter_address" placeholder="Your Address">
<input name="submitter_phone" placeholder="Your Phone *" required>

<button class="submitBtn" type="submit">Submit Doctor</button>

</form>
</div>
</div>

<div id="feedbackModal" class="modal hidden">
<div class="modalBox">
<div class="modalHead">
<h2>Feedback</h2>
<button data-close class="iconBtn">✕</button>
</div>

<form id="feedbackForm" class="form">
<textarea id="feedbackText" placeholder="Write feedback"></textarea>
<input id="feedbackImage" type="file" accept="image/*">
<button type="button" id="voiceBtn">🎤 Record Voice</button>
<button class="submitBtn" type="submit">Submit Feedback</button>
</form>
</div>
</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
