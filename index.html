<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c7a7b">
  <meta name="description" content="Cooch Behar Healthcare Directory – trusted doctors, chambers, timings">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Cooch Behar Healthcare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Announcement Bar (sticky top strip) -->
  <div id="announcement-bar" class="announcement-bar"></div>

  <header>
    <h1>🏥 Cooch Behar Healthcare</h1>
    <p>Community-verified doctor directory</p>
  </header>

  <!-- Search & Filters -->
  <section id="search-section">
    <input type="text" id="search-input" placeholder="ডাক্তারের নাম, স্পেশালিটি, চেম্বার…" autocomplete="off">
    <select id="specialty-filter">
      <option value="">সকল স্পেশালিটি</option>
    </select>
    <div class="quick-categories" id="quick-categories"></div>
  </section>

  <!-- Stats strip -->
  <div class="stats-bar">
    <span id="stats-total-visitors">০</span> মোট ভিজিটর |
    <span id="stats-today-visitors">০</span> আজকের ভিজিটর |
    <span id="stats-online-users">০</span> অনলাইন
  </div>

  <!-- Doctor cards container -->
  <section id="doctor-list" class="doctor-list"></section>

  <!-- News / Announcements Section -->
  <section id="news-section">
    <h2>📢 সর্বশেষ আপডেট</h2>
    <div id="news-cards" class="news-cards"></div>
  </section>

  <!-- User Contribution Form -->
  <section id="contribute-section">
    <h2>➕ নতুন তথ্য জমা দিন</h2>
    <form id="contribute-form">
      <input type="text" name="submitted_by_name" placeholder="আপনার নাম" required>
      <input type="tel" name="submitted_by_phone" placeholder="ফোন (ঐচ্ছিক)">
      <input type="text" name="submitted_by_whatsapp" placeholder="WhatsApp নম্বর (ঐচ্ছিক)">
      <input type="text" name="submitted_by_facebook" placeholder="Facebook প্রোফাইল (ঐচ্ছিক)">
      <textarea name="message" placeholder="ডাক্তারের নাম, স্পেশালিটি, চেম্বার, সময়..." required></textarea>
      <button type="submit">জমা দিন</button>
    </form>
  </section>

  <footer>
    <p>তথ্য শুধুমাত্র পাবলিক সোর্স থেকে সংগ্রহিত। ভেরিফিকেশন প্রক্রিয়াধীন।</p>
  </footer>

  <!-- Doctor detail popup (hidden) -->
  <div id="doctor-popup" class="popup">
    <div class="popup-content">
      <span class="close-popup">&times;</span>
      <div id="popup-details"></div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
  </html>
